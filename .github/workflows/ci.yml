name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  RENOVATE_VERSION: "44.121.4"

jobs:
  validate:
    name: renovate-config-validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: quokkify/ci-kit/actions/setup-node@v3.0.1
        with:
          node-version: "24.21.0"
          install-dependencies: "false"
          cache-dependencies: "false"

      - name: Validate tracked filename portability
        run: node scripts/validate-filenames.mjs

      - name: Validate all preset JSON files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name "*.json" \
            -not -name "package*.json" \
            -not -path './.github/release-please/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No preset JSON files found"
            exit 1
          fi
          echo "Validating ${#files[@]} files:"
          printf '  %s\n' "${files[@]}"
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict "${files[@]}"

      - name: Test composed update policies with Renovate
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" --call 'node --test tests/*.test.mjs'
