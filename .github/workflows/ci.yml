name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: renovate-config-validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: quokkify/project-toolkit/actions/setup-node@204b0f332c03d8ea8ceed920e3dc7487a13bb224 # v2.12.4
        with:
          node-version: "24"
          install-dependencies: "false"
          cache-dependencies: "false"

      - name: Validate all preset JSON files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name "*.json" \
            -not -name "package*.json")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No preset JSON files found"
            exit 1
          fi
          echo "Validating ${#files[@]} files:"
          printf '  %s\n' "${files[@]}"
          npx --yes --package renovate -- renovate-config-validator --strict "${files[@]}"
